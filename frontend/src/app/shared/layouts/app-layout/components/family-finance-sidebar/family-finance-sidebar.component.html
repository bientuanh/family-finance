<aside aria-label="Primary navigation" class="sidebar">
  @for (navLink of navLinks; track navLink.key) {
    <a
      [routerLink]="navLink.routerLink"
      class="nav-item"
      [class.active]="activeItem() === navLink.key"
      (click)="onNavItemSelected()"
    >
      <span aria-hidden="true" class="nav-icon">
        @switch (navLink.icon) {
          @case ('home') {
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1V10Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              ></path>
            </svg>
          }
          @case ('calendar') {
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
              <path d="M7.5 3v4M16.5 3v4M4 9.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2.8v18.4M17 6.2c-.9-1-2.4-1.6-4.5-1.6-2.4 0-4 1.1-4 2.8 0 4.6 9.5 1.5 9.5 6.7 0 2-1.9 3.5-4.9 3.5-2 0-3.7-.6-5-1.8"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              ></path>
            </svg>
          }
        }
      </span>
      <span>{{ navLink.label }}</span>
    </a>
  }

</aside>
