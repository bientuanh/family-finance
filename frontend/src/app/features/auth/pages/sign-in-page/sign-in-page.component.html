<app-home-layout>
  <section class="auth-page">
    <div class="auth-card" aria-labelledby="sign-in-title">
      <h1 id="sign-in-title">Sign in</h1>
      <p class="auth-subtitle">Sign in để tiếp tục vào Family Finance dashboard.</p>

      <form [formGroup]="form" (ngSubmit)="signIn()" novalidate>
        <div class="field">
          <label for="email">Email <span class="required">*</span></label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            [attr.aria-invalid]="hasEmailError()"
          />
          @if (hasEmailError()) {
            <p class="field-error">Email không hợp lệ.</p>
          }
        </div>

        <div class="field">
          <label for="password">Password <span class="required">*</span></label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-invalid]="hasPasswordError()"
          />
          @if (hasPasswordError()) {
            <p class="field-error">Password cần tối thiểu 8 ký tự, gồm chữ và số.</p>
          }
        </div>

        @if (submitErrorMessage) {
          <p class="field-error">{{ submitErrorMessage }}</p>
        }

        <app-ui-button [type]="'submit'" [disabled]="isSubmitting">Sign in</app-ui-button>
      </form>

      <p class="auth-switch">
        Chưa có account?
        <a [routerLink]="routeLinks.SIGN_UP">Sign up</a>
      </p>
    </div>
  </section>
</app-home-layout>
