<section class="home-hero">
  <div class="home-container home-hero__inner">
    <app-ui-badge [text]="'Simple monthly planning for families'"></app-ui-badge>
    <h1>Plan your money with confidence, one month at a time.</h1>
    <p>
      Create a monthly budget in seconds, keep your seven jars balanced, and make better
      spending decisions with clear numbers.
    </p>

    <div class="home-hero__actions">
      <app-ui-button [routerLink]="planningRouteLink()">Create monthly plan</app-ui-button>
      <app-ui-button [href]="'#features'" [variant]="'secondary'">View features</app-ui-button>
    </div>
  </div>
</section>
